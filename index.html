<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#00653e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@500;600&family=Doto:wght@700;900&display=swap" />
    <!-- Hero poster: portrait cut for tall screens, landscape otherwise. Mirrors pickCut() in Hero.tsx. -->
    <link rel="preload" as="image" href="/hero/truck-reveal-first.jpg" fetchpriority="high" />
    <!-- Apply the saved/system theme before first paint to avoid a light flash for dark-mode users -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* storage unavailable */ }
      })();
    </script>
    <title>FreightFlow | Full-Truckload Carrier — 48 States from Chicago</title>
    <meta name="description" content="FreightFlow is a full-truckload carrier serving all 48 contiguous states from its dispatch hub in Chicago — 2025–2027 Freightliner Cascadias, GPS tracking on every load, and digital proof of delivery. USDOT 4357973 · MC 1704871.">
